spring.application.name=demo

# ---------- Database (H2 in-memory) ----------
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.username=sa
spring.datasource.password=

# Browse the database in your browser: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:studentdb, user: sa, empty password)
spring.h2.console.enabled=true

# ---------- JPA / Hibernate ----------
# "update" = Hibernate creates/updates tables automatically from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs, so you can learn what happens behind the scenes
spring.jpa.show-sql=true

# ---------- To switch to PostgreSQL later ----------
# spring.datasource.url=jdbc:postgresql://localhost:5432/studentdb
